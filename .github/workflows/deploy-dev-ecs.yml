name: Deploy Dev ECS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECS_CLUSTER: baro-dev
  ECS_SERVICE: baro-dev-baro-mobile
  ECS_CONTAINER_NAME: baro-dev-baro-mobile
  ECR_REPOSITORY: baro-dev-baro-mobile

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg VITE_KAKAO_MAP_APP_KEY="${{ secrets.VITE_KAKAO_MAP_APP_KEY }}" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Register task definition and deploy
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${KAKAO_REST_API_KEY:-}" ]; then
            echo "KAKAO_REST_API_KEY GitHub secret is empty or missing" >&2
            exit 1
          fi

          TASK_DEF_JSON="$(mktemp)"
          NEW_TASK_DEF_JSON="$(mktemp)"
          trap 'rm -f "$TASK_DEF_JSON" "$NEW_TASK_DEF_JSON"' EXIT

          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          TASK_DEF_ARN="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)"

          if [ -z "$TASK_DEF_ARN" ] || [ "$TASK_DEF_ARN" = "None" ]; then
            echo "Could not resolve current task definition for service $ECS_SERVICE" >&2
            exit 1
          fi

          aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --query 'taskDefinition' \
            --output json > "$TASK_DEF_JSON"

          CONTAINER_NAME="$ECS_CONTAINER_NAME"
          if ! jq -e --arg name "$CONTAINER_NAME" \
            '.containerDefinitions[] | select(.name == $name)' \
            "$TASK_DEF_JSON" >/dev/null; then
            CONTAINER_COUNT="$(jq '.containerDefinitions | length' "$TASK_DEF_JSON")"

            if [ "$CONTAINER_COUNT" = "1" ]; then
              CONTAINER_NAME="$(jq -r '.containerDefinitions[0].name' "$TASK_DEF_JSON")"
            else
              echo "Container '$CONTAINER_NAME' not found. Set ECS_CONTAINER_NAME explicitly." >&2
              exit 1
            fi
          fi

          jq --arg name "$CONTAINER_NAME" --arg image "$IMAGE_URI" '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy,
              .deregisteredAt
            )
            | .containerDefinitions |= map(
                if .name == $name then
                  .image = $image
                  | .environment = (
                      ((.environment // []) | map(select(.name != "KAKAO_REST_API_KEY")))
                      + [{ "name": "KAKAO_REST_API_KEY", "value": env.KAKAO_REST_API_KEY }]
                    )
                else
                  .
                end
              )
          ' "$TASK_DEF_JSON" > "$NEW_TASK_DEF_JSON"

          NEW_TASK_DEF_ARN="$(aws ecs register-task-definition \
            --cli-input-json "file://$NEW_TASK_DEF_JSON" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$NEW_TASK_DEF_ARN" \
            --force-new-deployment >/dev/null

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

          echo "Deployed task definition: $NEW_TASK_DEF_ARN"
